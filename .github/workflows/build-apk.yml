name: Build Project & ZIP Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  package-zip:
    name: Package Complete Project ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Create Clean Project ZIP
        run: |
          zip -r Sensei_Full_App_Source.zip . -x "*.git*" "dist/*" ".cache/*"

      - name: Upload Project ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sensei_Full_App_Source_ZIP
          path: Sensei_Full_App_Source.zip
          retention-days: 30

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: package-zip
    continue-on-error: true
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Web Application
        run: npm run build

      - name: Sync Web Assets to Android App
        run: |
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/ || true

      - name: Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: Build Android APK with Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace || true

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SenSey-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 30
